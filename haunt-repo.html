<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunt Repo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#0e0a14;--panel:#171020;--bone:#e8e0d0;--ember:#ff7a1a;--ghost:#7dffb0;--blood:#7a1426;--candle:#ffd27a;--muted:#a79fb5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a14}}
:root[data-theme="dark"]{--bg:#0e0a14}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--bone);font:16px/1.5 "Source Serif 4",Georgia,serif}
body.hc{--bone:#fff;--muted:#e0d8ee}
body.rm *{animation:none!important}
h1{font:700 1.5rem "Cinzel Decorative",Georgia,serif;margin:0;letter-spacing:.04em}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid #4a3c5c;border-radius:6px;padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--candle)}
button[aria-pressed="true"]{border-color:var(--ghost);color:var(--ghost)}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #2a2036}
.score{display:flex;align-items:center;gap:.75rem}
.score b{font:700 1.8rem "JetBrains Mono",monospace;color:var(--candle)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;padding:.75rem 1.25rem}
main{display:grid;grid-template-columns:1fr 320px;gap:1rem;padding:0 1.25rem 1.5rem}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{position:relative;background:#0a0710;border:1px solid #2a2036;border-radius:8px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.dark{position:absolute;inset:0;pointer-events:none;display:block;opacity:0;transition:opacity 1.2s;background:radial-gradient(circle 70px at var(--mx,50%) var(--my,50%),transparent 0,rgba(10,7,16,.6) 55%,rgba(10,7,16,.94) 100%)}
.lc .dark{opacity:1}
#big{transition:filter 1.2s}
#big.lit{filter:brightness(1.3) saturate(1.08)}
body.rm .dark,body.rm #big{transition:none}
aside{background:var(--panel);border:1px solid #2a2036;border-radius:8px;padding:1rem;align-self:start}
aside h2{font:700 1.05rem "Cinzel Decorative",Georgia,serif;margin:0 0 .5rem;word-break:break-all}
.mono{font-family:"JetBrains Mono",monospace;font-size:.82rem}
.row{display:flex;justify-content:space-between;gap:.5rem;color:var(--muted)}
.row b{color:var(--bone);font-weight:600}
.au{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.au i{display:block;height:6px;background:var(--ember);border-radius:3px}
.why{border-left:3px solid var(--ghost);padding-left:.75rem;margin:.75rem 0}
.legend{color:var(--muted);font-size:.85rem;margin-top:1rem}
.legend p{margin:.15rem 0}
.room{cursor:pointer}
.room rect.b{stroke:#5a4a6c;stroke-width:1}
.room:hover rect.b,.room:focus-visible rect.b,.room.sel rect.b{stroke:var(--candle);stroke-width:2}
.room:focus-visible{outline:none}
.dim{opacity:.22}
.fl{animation:fl var(--d) ease-in-out infinite alternate}
@keyframes fl{from{opacity:.05}to{opacity:var(--o)}}
.gh{animation:fy 3.4s ease-in-out infinite alternate}
@keyframes fy{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.poof{animation:poof 1s forwards}
@keyframes poof{to{opacity:0;transform:translateY(-14px)}}
.stage [hidden]{display:none!important}
.dark{z-index:2}
.tabs{display:flex;gap:.25rem;padding:.5rem 1.25rem 0;border-bottom:1px solid #2a2036}
.tabs button{border-radius:6px 6px 0 0;margin-bottom:-1px}
.tabs [aria-selected="true"]{border-color:var(--candle);color:var(--candle);background:var(--bg);border-bottom-color:var(--bg)}
.stage.rv{height:calc(100dvh - 200px);min-height:420px}
.stage.rv #big{width:100%;height:100%;touch-action:none;user-select:none}
.gw{transition:opacity .4s;cursor:grab}
.gw.gone{opacity:0;pointer-events:none}
.gw.hold .gh{animation:shake .1s linear infinite alternate}
.gw.hold .ring{animation:ring 1.1s linear forwards}
.gw.caught .gh{animation:suck .6s ease-in forwards;transform-box:fill-box;transform-origin:center}
.gw.caught .ring{opacity:0}
@keyframes shake{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes ring{to{stroke-dasharray:100 100}}
@keyframes suck{to{transform:rotate(540deg) scale(0);opacity:0}}
.hud{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;width:min(230px,calc(100vw - 24px));background:var(--panel);border:1px solid #4a3c5c;border-radius:8px;padding:.4rem .55rem;font:.66rem "JetBrains Mono",monospace;display:grid;gap:.25rem}
.hud .modes{display:flex;gap:.35rem}
.hud .modes button{flex:1;padding:.2rem .3rem;font-size:.64rem;white-space:nowrap}
.hud b{color:var(--ghost)}
.ic{display:flex;flex-wrap:wrap;gap:2px;line-height:1;min-height:11px;font-size:.7rem}
.ic span{opacity:.3;color:var(--bone)}
.ic span.on{opacity:1}
.ic svg{fill:currentColor;display:block}
#gi span.on{color:var(--ghost)}
#ki span.on{color:var(--ember)}
.sk{transition:transform 2.6s linear}
body.rm .sk{transition-duration:.01s}
.sh #big{cursor:crosshair}
.bob{animation:bob .36s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
.sk.hit .fx{animation:flash .25s}
@keyframes flash{50%{opacity:.15}}
.sk.dead .fx{animation:fall .6s ease-in forwards}
@keyframes fall{to{transform:translateY(70px) rotate(75deg);opacity:0}}
#bb.hold .ring{animation:ring 1.1s linear forwards}
#bb.hold .skull{animation:shake .1s linear infinite alternate}
.rumble{animation:rum .09s linear infinite alternate}
@keyframes rum{from{transform:translate(-2px,1px)}to{transform:translate(2px,-1px)}}
.bbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:5;width:min(440px,90%);display:grid;gap:.3rem;background:rgba(14,10,20,.85);border:1px solid #4a3c5c;border-radius:8px;padding:.5rem .7rem;font-size:.8rem}
.bbar p{margin:0;color:var(--candle)}
.bl{display:flex;align-items:center;gap:.5rem}
.bl span{width:3.5rem}
.bl i{flex:1;height:8px;background:#2a2036;border-radius:4px;overflow:hidden}
.bl u{display:block;height:100%;width:100%;background:var(--ember);text-decoration:none;transition:width .2s}
.bl u.sp{background:var(--ghost)}
.win{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;background:rgba(10,7,16,.9);padding:1rem}
.win h2{font:700 1.5rem "Cinzel Decorative",Georgia,serif;margin:0}
.win p{margin:0;max-width:34ch}
.hp{position:absolute;top:10px;left:10px;z-index:5;display:grid;gap:.3rem;width:min(240px,60%);background:rgba(14,10,20,.85);border:1px solid #4a3c5c;border-radius:8px;padding:.3rem .6rem;font-size:.75rem}
.hp i{flex:1;height:10px;background:#2a2036;border-radius:5px;overflow:hidden}
.hp u{display:block;height:100%;width:100%;text-decoration:none;background:var(--ghost);transition:width .25s,background .25s}
.hp b{min-width:2.2ch;text-align:right}
.hurt{animation:hurt .55s}
@keyframes hurt{0%{box-shadow:inset 0 0 0 10px #ff4d6a,inset 0 0 170px rgba(255,77,106,.75)}100%{box-shadow:inset 0 0 0 0 transparent,inset 0 0 0 transparent}}
.pj{cursor:crosshair}
.hr{display:flex;align-items:center;gap:.5rem}
.hr span{width:3.6rem}
.hp u.cy{background:#6ec6ff}
.hud #sb{font-size:.64rem;padding:.2rem .3rem;white-space:nowrap}
.ret{position:absolute;left:0;top:0;width:40px;height:40px;z-index:4;pointer-events:none;display:none;transform:translate(-100px,-100px)}
.stage.rv .ret{display:block}
.ret svg{display:block;overflow:visible}
.ret .rc{fill:none;stroke:var(--ghost);stroke-width:3}
.sh .ret .rc{stroke:var(--ember)}
.ret .rd{fill:var(--bone);display:none}
.sh .ret .rd{display:block}
.ret .rr{fill:none;stroke:var(--candle);stroke-width:3}
.ret.hold .rr{animation:ring 1.1s linear forwards}
.shd .ret{opacity:.3}
.stage.rv #big,.stage.rv #big *{cursor:none}
.gw .ring,#bb .ring{display:none}
.dome{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,86%);height:min(36%,220px);border:4px solid rgba(110,198,255,.9);border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(ellipse at 50% 100%,rgba(110,198,255,.08),rgba(110,198,255,.28) 78%,rgba(110,198,255,.12));box-shadow:0 0 30px rgba(110,198,255,.5),inset 0 0 30px rgba(110,198,255,.4);z-index:4;pointer-events:none;display:none}
.dome.on{display:block}
.dome.blk{box-shadow:0 0 60px #fff,inset 0 0 60px rgba(255,255,255,.7)}
.nav{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:.75rem;background:rgba(14,10,20,.88);border:1px solid #4a3c5c;border-radius:8px;padding:.35rem .6rem}
</style>
</head>
<body>
<header>
  <h1>Haunt Repo</h1>
  <div class="score" aria-live="polite">
    <svg width="40" height="56" viewBox="0 0 40 56" aria-hidden="true"><defs><radialGradient id="gl"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs><circle id="glow" cx="20" cy="30" r="20" fill="url(#gl)"/><path d="M12 14h16l3 30H9z" fill="none" stroke="#e8e0d0" stroke-width="2"/><path d="M15 6h10v8H15z" fill="none" stroke="#e8e0d0" stroke-width="2"/><ellipse id="flame" cx="20" cy="34" rx="4" ry="7" fill="#ffd27a"/></svg>
    <div><b id="sc">0</b><span class="mono"> / 100 haunt score</span><div class="mono" style="color:var(--muted)">Higher means healthier.</div></div>
  </div>
</header>
<div class="tabs" role="tablist" aria-label="Views"><button role="tab" id="tmap" aria-selected="true">Map</button><button role="tab" id="troom" aria-selected="false">Room</button><button role="tab" id="tboss" aria-selected="false" hidden>Boss</button></div>
<div class="bar" role="toolbar" aria-label="Filters and settings">
  <button data-f="all" aria-pressed="true">All rooms</button>
  <button data-f="dust" aria-pressed="false">Dusty</button>
  <button data-f="flicker" aria-pressed="false">Flickering</button>
  <button data-f="ghost" aria-pressed="false">Ghosts</button>
  <button data-f="skeletons" aria-pressed="false">Skeletons</button>
  <button data-f="portraits" aria-pressed="false">Empty portraits</button>
  <button id="worst" aria-pressed="false">Worst 10</button>
  <button id="lc" aria-pressed="true">Lantern cursor</button>
  <button id="rm" aria-pressed="false">Reduce motion</button>
  <button id="hc" aria-pressed="false">High contrast</button>
</div>
<main>
  <div class="stage" id="stage"><svg id="svg" viewBox="0 0 960 580" role="group" aria-label="Haunted mansion map of the repository"></svg><svg id="big" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" role="img" hidden></svg><div class="dark"></div><div class="hp" id="hpw" hidden><div class="hr"><span class="mono">Health</span><i><u id="hpb"></u></i><b id="hpt" class="mono">100</b></div><div class="hr"><span class="mono">Shield</span><i><u id="shb" class="cy"></u></i><b id="sht" class="mono">100</b></div></div><div class="win" id="lose" hidden><h2>The haunt got you</h2><p>Your health ran out. Your progress is saved.</p><button id="lb">Get back up</button></div><div class="dome" id="dome"></div><div class="ret" id="ret"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><circle class="rc" cx="20" cy="20" r="12"/><circle class="rd" cx="20" cy="20" r="2"/><circle class="rr" cx="20" cy="20" r="17" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 20 20)"/></svg></div><div class="bbar" id="bbar" hidden><p id="bmsg" class="mono"></p><div class="bl"><span>Bones</span><i><u id="bu1"></u></i></div><div class="bl"><span>Spirit</span><i><u id="bu2" class="sp"></u></i></div></div><div class="win" id="win" hidden><h2>The mansion is at peace</h2><p id="wt"></p><button id="wb">Back to the map</button></div><div class="nav" id="nav" hidden><button id="prv" aria-label="Previous room">◀</button><span id="cnt" class="mono"></span><button id="nxt" aria-label="Next room">▶</button></div></div>
  <aside id="ins" aria-live="polite"></aside>
</main>
<div class="hud" id="hud"><div class="modes" role="group" aria-label="Weapon"><button id="mc" aria-pressed="true">Catch ghosts</button><button id="ms" aria-pressed="false">Shoot skeletons</button></div><button id="sb" aria-pressed="false">Hold to shield (Space)</button><div>Ghosts caught <b id="gc"></b></div><div class="ic" id="gi" aria-hidden="true"></div><div>Skeletons shot <b id="kc"></b></div><div class="ic" id="ki" aria-hidden="true"></div><div id="hint" style="color:var(--muted)" role="status"></div></div>
<script>
// Demo data: path,sizeKB,daysSinceTouch,churn90d,bugFixCommits,commits,todos,authors,topAuthorShare
const RAW=`src/auth/login.ts,6,12,18,9,30,2,3,.7
src/auth/session.ts,5,40,6,4,22,1,3,.6
src/auth/oauth.ts,8,300,2,3,15,0,4,.35
src/auth/legacy-sso.ts,12,1100,0,6,18,5,5,.3
src/api/routes.ts,9,5,20,10,40,3,5,.3
src/api/users.ts,7,60,9,3,25,1,3,.6
src/api/billing.ts,14,20,16,12,35,4,6,.25
src/api/webhooks.ts,6,200,3,2,12,2,2,.8
src/api/v1-compat.ts,10,900,0,5,14,6,5,.3
src/ui/App.tsx,8,3,14,4,45,1,4,.5
src/ui/Header.tsx,3,30,4,0,10,0,2,.9
src/ui/Table.tsx,9,15,11,5,28,2,3,.55
src/ui/Modal.tsx,4,500,1,1,9,0,2,.8
src/ui/theme.css,5,8,7,0,20,0,2,.7
src/db/schema.ts,7,25,8,2,20,0,3,.6
src/db/migrate.ts,6,120,2,3,12,1,3,.7
src/db/seed.ts,3,600,0,0,5,0,1,1
src/db/old-queries.ts,11,1400,0,7,16,7,6,.2
src/utils/dates.ts,3,45,3,4,17,1,3,.6
src/utils/format.ts,2,90,1,0,8,0,2,.8
src/utils/retry.ts,2,10,5,1,9,0,2,.7
src/utils/hacks.ts,5,700,0,4,11,9,5,.3
tests/auth.test.ts,5,12,10,0,16,0,2,.8
tests/api.test.ts,6,30,9,0,15,1,3,.6
tests/e2e.test.ts,8,400,2,1,7,3,3,.5
scripts/deploy.sh,2,35,4,6,14,2,3,.6
scripts/backup.sh,1,1000,0,1,4,1,2,.6
scripts/fix-prod.sh,2,70,6,5,9,3,4,.3
docs/README.md,4,18,3,0,22,0,6,.3
docs/ARCH.md,5,800,0,0,6,2,4,.35
config/env.ts,2,22,6,2,13,0,3,.7
config/flags.ts,3,9,12,3,19,4,5,.3`;
const TODOS=["Remove this workaround","Handle the error case","Why does this work?","Rewrite before launch","Add a test"];
const FILES=RAW.split("\n").filter((_,i)=>i%2===0).map(r=>{const [path,kb,days,churn,bugs,commits,todos,authors,top]=r.split(",");
  return{path,kb:+kb,days:+days,churn:+churn,bugs:+bugs,commits:+commits,todos:+todos,authors:+authors,top:+top}});
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function signals(f){return{
  dust:clamp(f.days/730),flicker:clamp(f.churn/20),ghost:f.commits?clamp(f.bugs/f.commits*2):0,skeletons:f.todos,
  portraits:f.authors>=4&&f.top<.4?clamp((f.authors-3)/6):0}}
const level=s=>clamp(.3*s.dust+.25*s.flicker+.25*s.ghost+.1*clamp(s.skeletons/5)+.1*s.portraits);
const ZERO={dust:0,flicker:0,ghost:0,skeletons:0,portraits:0};
function why(f,s){const p=[];
  if(s.dust>.4)p.push(`nobody has touched it in ${f.days>=365?(f.days/365).toFixed(1)+" years":f.days+" days"}`);
  if(s.flicker>.4)p.push(`${f.churn} commits landed in the last 90 days`);
  if(s.ghost>.4)p.push(`${f.bugs} of ${f.commits} commits were bug fixes`);
  if(s.skeletons>1)p.push(`${s.skeletons} TODOs are still lurking`);
  if(s.portraits>.3)p.push(`${f.authors} authors have edited it and none owns it`);
  return p.length?p.join("; ")[0].toUpperCase()+p.join("; ").slice(1)+".":"This room is calm and well kept."}

// Folder tree -> slice-and-dice treemap
const root={name:"",kids:[],size:0};
FILES.forEach(f=>{let n=root;const p=f.path.split("/");
  p.slice(0,-1).forEach(s=>{let c=n.kids.find(k=>k.name===s&&!k.f);if(!c){c={name:s,kids:[],size:0};n.kids.push(c)}n=c});
  n.kids.push({name:p[p.length-1],f,size:f.kb+4,kids:[]})});
(function sz(n){if(!n.f)n.size=n.kids.reduce((a,k)=>a+sz(k),0);return n.size})(root);
const rooms=[],folders=[];
function lay(n,x,y,w,h,v){
  if(n.f){f=n.f;rooms.push((()=>{const s=signals(f);return{f,x,y,w,h,s,done:false,gn:s.ghost>.15?Math.min(3,1+Math.round(s.ghost*2)):0,got:new Set(),gp:[],sn:Math.min(2,f.todos),sdead:new Set(),shp:[],sp:[]}})());return}
  const hd=n.name?15:0;if(n.name)folders.push({name:n.name,x,y});
  const ix=x+(n.name?3:0),iy=y+(n.name?3:0)+hd,iw=w-(n.name?6:0),ih=h-(n.name?6:0)-hd;let o=0;
  n.kids.sort((a,b)=>b.size-a.size).forEach(c=>{const fr=c.size/n.size;
    v?lay(c,ix+o*iw,iy,iw*fr,ih,!v):lay(c,ix,iy+o*ih,iw,ih*fr,!v);o+=fr})}
var f;lay(root,0,0,960,580,true);
rooms.forEach((r,i)=>r.i=i);

const st={sel:null,filter:"all",worst:false,undo:[],view:"map"};
const sig=r=>r.done?ZERO:{...r.s,ghost:r.gn&&r.got.size>=r.gn?0:r.s.ghost,skeletons:r.sn&&r.sdead.size>=r.sn?0:r.s.skeletons}, lvl=r=>level(sig(r));
function score(){let t=0,w=0;rooms.forEach(r=>{t+=lvl(r)*r.f.kb;w+=r.f.kb});return Math.round(clamp(100-t/w*100*1.6,0,100))}
const $=s=>document.querySelector(s);

function ghostSvg(x,y,o,d){return`<g transform="translate(${x} ${y})"><g class="gh" style="animation-delay:${d}s"><path d="M0 7a6 6 0 0 1 12 0v7l-2-2-2 2-2-2-2 2-2-2-2 2z" fill="#7dffb0" opacity="${o}"/><circle cx="4" cy="6" r="1.2" fill="#0e0a14"/><circle cx="8" cy="6" r="1.2" fill="#0e0a14"/></g></g>`}
function roomSvg(r){
  const s=sig(r),{x,y,w,h}=r,L=lvl(r),pad=1.5,rx=x+pad,ry=y+pad,rw=w-pad*2,rh=h-pad*2,big=rw>30&&rh>24;
  const f=st.filter,match=f==="all"||(f==="portraits"?s.portraits>.2:f==="skeletons"?s.skeletons>0:s[f]>.3);
  const wr=!st.worst||worstSet.has(r.i);
  let g=`<g class="room${st.sel===r.i?" sel":""}${match&&wr?"":" dim"}" data-i="${r.i}" tabindex="0" role="button" aria-label="${r.f.path}, haunt level ${L>.55?"high":L>.25?"medium":"low"}">`;
  g+=`<rect class="b" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="3" fill="#ffd27a" fill-opacity="${(.14*(1-L)).toFixed(3)}"/>`;
  g+=`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="3" fill="#0e0a14" fill-opacity="${(.5*L+.15).toFixed(2)}" pointer-events="none"/>`;
  if(s.dust>.05&&big){const c=Math.min(rw,rh)*.55;

$("#lb").onclick=()=>{st.hp=100;hp();st.over=false;$("#lose").hidden=true};
function shootAt(el,kind,dx){
  const r=el.getBoundingClientRect(),o=svgPt({clientX:r.left+r.width/2,clientY:r.top+r.height/2});
  const spec={ghost:{c:"#7dffb0",r:20,dmg:4,ms:2300,b:80},skel:{c:"#e8e0d0",r:20,dmg:6,ms:1900,b:80},boss:{c:"#ff7a1a",r:36,dmg:9,ms:2000,b:130}}[kind];
  const g=document.createElementNS(NS,"g");g.setAttribute("class","pj");g.dataset.c=spec.c;
  g.innerHTML=`<circle r="${spec.r+24}" fill="transparent"/>`+(kind==="skel"
    ?`<g transform="scale(2)"><path d="M-12 0H12" stroke="#e8e0d0" stroke-width="5" stroke-linecap="round"/><circle cx="-12" cy="-3" r="4" fill="#e8e0d0"/><circle cx="-12" cy="3" r="4" fill="#e8e0d0"/><circle cx="12" cy="-3" r="4" fill="#e8e0d0"/><circle cx="12" cy="3" r="4" fill="#e8e0d0"/></g>`
    :`<circle r="${spec.r*1.6}" fill="${spec.c}" opacity=".22"/><circle r="${spec.r}" fill="${spec.c}" stroke="#0e0a14" stroke-width="3" style="filter:drop-shadow(0 0 14px ${spec.c})"/><circle r="${spec.r*.4}" fill="#fff" opacity=".7"/>`);
  $("#big").appendChild(g);burst(o.x,o.y,spec.c,spec.b*.6);
  const tx=500+(dx??(Math.random()-.5)*160);
  g._a=g.animate([{transform:`translate(${o.x}px,${o.y}px) scale(.6) rotate(0deg)`},{transform:`translate(${tx}px,590px) scale(2.3) rotate(${kind==="skel"?720:0}deg)`}],{duration:spec.ms,easing:"ease-in"});
  g._a.onfinish=()=>{if(!g.isConnected)return;g.remove();
    if(st.up){st.en=Math.max(0,st.en-{ghost:6,skel:8,boss:12}[kind]);const d=$("#dome");d.classList.add("blk");setTimeout(()=>d.classList.remove("blk"),160);burst(tx,570,"#6ec6ff",spec.b*.8);if(st.en<=0)lower(true);return}
    burst(tx,590,spec.c,spec.b);hurt(spec.dmg)}}
// Shield: hold Space, right-click, or the Shield button. It drains while up and each block costs extra.
// If it runs dry it breaks and must recharge to 30 before you can raise it again.
function raise(){if(st.up||st.broke||st.over||st.en<=0||(st.view!=="room"&&st.view!=="boss"))return;
  st.up=true;endHold();$("#dome").classList.add("on");$("#stage").classList.add("shd");$("#sb").setAttribute("aria-pressed","true")}
function lower(broke){st.up=false;if(broke)st.broke=true;$("#dome").classList.remove("on");$("#stage").classList.remove("shd");$("#sb").setAttribute("aria-pressed","false")}
function shieldTick(dt){
  if(st.up){st.en=Math.max(0,st.en-18*dt);if(st.en<=0)lower(true)}
  else st.en=Math.min(100,st.en+(st.broke?12:16)*dt);
  if(st.broke&&st.en>=30)st.broke=false;
  $("#shb").style.width=st.en+"%";$("#sht").textContent=Math.round(st.en)}
document.addEventListener("keydown",e=>{if(e.code!=="Space"||st.view==="map")return;e.preventDefault();if(!e.repeat)raise()});
document.addEventListener("keyup",e=>{if(e.code!=="Space"||st.view==="map")return;e.preventDefault();lower()});
document.addEventListener("pointerup",e=>{if(e.button===2)lower()});
window.addEventListener("blur",()=>lower());
$("#big").addEventListener("contextmenu",e=>e.preventDefault());
$("#sb").addEventListener("pointerdown",e=>{e.preventDefault();raise()});
["pointerup","pointerleave","pointercancel"].forEach(t=>$("#sb").addEventListener(t,()=>lower()));
// The small circle that follows your pointer: green to catch, orange with a dot to shoot.
["pointermove","pointerdown"].forEach(t=>$("#stage").addEventListener(t,e=>{const b=e.currentTarget.getBoundingClientRect();
  $("#ret").style.transform=`translate(${e.clientX-b.left-20}px,${e.clientY-b.top-20}px)`}));
function tick(){
  if(st.over||document.hidden||(st.view!=="room"&&st.view!=="boss"))return;
  const now=performance.now(),boss=st.view==="boss";
  const list=boss?((st.b&&st.b.up&&!st.b.dead)?[[$("#bhit"),"boss"]]:[])
    :[...document.querySelectorAll("#big .gw:not(.gone):not(.caught)")].map(e=>[e,"ghost"]).concat([...document.querySelectorAll("#big .sk:not(.dead)")].map(e=>[e,"skel"]));
  list.forEach(([el,kind])=>{
    const n=atk.get(el);if(n==null){atk.set(el,now+1500+Math.random()*3500);return}
    if(now<n)return;
    if(hold&&hold.el===el){atk.set(el,now+800);return}
    atk.set(el,now+(kind==="boss"?1800+Math.random()*800:kind==="ghost"?5000+Math.random()*3500:4000+Math.random()*3000));
    if(kind==="boss")[-170,0,170].forEach(d=>shootAt(el,kind,d));else shootAt(el,kind)})}

// Skeletons wander: every 2.6s each one picks a new spot and the CSS transition walks it there.
function walk(){setInterval(()=>{
  if(st.view!=="room"||document.hidden)return;const r=rooms[st.sel];
  document.querySelectorAll("#big .sk:not(.dead)").forEach(el=>{const k=+el.dataset.k,p=r.sp[k]||[300,300,1];
    const nx=Math.min(880,Math.max(120,p[0]+(Math.random()-.5)*520)),ny=Math.min(400,Math.max(250,p[1]+(Math.random()-.5)*140)),dir=nx>=p[0]?1:-1;
    r.sp[k]=[nx,ny,dir];el.style.transform=`translate(${nx}px,${ny}px)`;el.firstElementChild.style.transform=`scaleX(${dir})`})},2600)}

// Final boss: a skeleton-ghost that claws its way out of the floor, then drifts side to side.
function bossScene(){
  if(!st.b)st.b={t0:performance.now(),bones:12,spirit:4,up:false,dead:false};
  const rib=[0,1,2,3,4].map(i=>{const y=225+i*17,w=62-i*5;return`<path d="M500 ${y}Q${500-w} ${y-8} ${500-w+8} ${y+18}M500 ${y}Q${500+w} ${y-8} ${500+w-8} ${y+18}"/>`}).join("");
  const teeth=[0,1,2,3,4,5,6,7].map(i=>`<path d="M${461+i*11} 198V219"/>`).join("");
  const lines=[...Array(13)].map((_,k)=>`<path d="M${500+(k-6)*70} 400L${500+(k-6)*300} 900"/>`).join("")+[450,530,620].map(y=>`<path d="M-1500 ${y}H2500"/>`).join("");
  const big=$("#big");
  big.innerHTML=`<defs>
    <clipPath id="fc"><rect x="-200" y="-100" width="1400" height="600"/></clipPath>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f24"/><stop offset="1" stop-color="#0e0a14"/></linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb0" stop-opacity=".7"/><stop offset="1" stop-color="#7dffb0" stop-opacity="0"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#7dffb0" stop-opacity=".4"/><stop offset="1" stop-color="#7dffb0" stop-opacity="0"/></radialGradient></defs>
  <rect x="-1500" y="-900" width="4000" height="1300" fill="url(#bg1)"/>
  <rect x="60" y="90" width="150" height="210" fill="#0a0710" stroke="#5a4a6c" stroke-width="6"/><circle cx="150" cy="150" r="22" fill="#e8e0d0" opacity=".8"/>
  <rect x="790" y="90" width="150" height="210" fill="#0a0710" stroke="#5a4a6c" stroke-width="6"/>
  <rect x="-1500" y="400" width="4000" height="1400" fill="#241830"/><rect x="-1500" y="392" width="4000" height="10" fill="#3a2a48"/>
  <g stroke="#34243f" stroke-width="2">${lines}</g>
  <ellipse id="hole" cx="500" cy="500" rx="40" ry="26" fill="#050308" stroke="#7dffb0" stroke-opacity=".5" stroke-width="3"/>
  <path id="crack" d="M500 500L430 520L360 506M500 500L575 524L650 508M500 500L492 560L508 600" stroke="#7dffb0" stroke-width="4" fill="none" opacity="0"/>
  <g clip-path="url(#fc)">
    <g id="bb">
      <ellipse cx="500" cy="270" rx="230" ry="260" fill="url(#aura)"/>
      <path d="M430 300H570L610 440Q590 410 570 440Q550 410 530 440Q510 410 490 440Q470 410 450 440Q430 410 410 440Z" fill="url(#tl)"/>
      <g stroke="#e8e0d0" stroke-width="7" fill="none" stroke-linecap="round"><path d="M500 205V320"/>${rib}</g>
      <g class="skull">
        <path d="M452 112Q428 66 404 58Q428 92 438 126Z" fill="#e8e0d0"/><path d="M548 112Q572 66 596 58Q572 92 562 126Z" fill="#e8e0d0"/>
        <ellipse cx="500" cy="150" rx="56" ry="60" fill="#e8e0d0"/><path d="M456 195h88v26q-44 16-88 0z" fill="#e8e0d0"/>
        <g stroke="#0e0a14" stroke-width="3">${teeth}</g>
        <ellipse cx="478" cy="145" rx="15" ry="19" fill="#0e0a14"/><ellipse cx="522" cy="145" rx="15" ry="19" fill="#0e0a14"/>
        <circle cx="478" cy="148" r="6" fill="#7dffb0"/><circle cx="522" cy="148" r="6" fill="#7dffb0"/>
        <path d="M500 165l-7 14h14z" fill="#0e0a14"/>
      </g>
      <circle class="ring" cx="500" cy="150" r="90" fill="none" stroke="#ffd27a" stroke-width="6" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 500 150)"/>
      <rect id="bhit" x="410" y="80" width="180" height="360" fill="transparent"/>
    </g>
    <g fill="none" stroke="#e8e0d0" stroke-linecap="round" stroke-linejoin="round">
      <path id="ar0" stroke-width="14"/><path id="ar1" stroke-width="14"/>
      <circle id="ej0" r="11" fill="#e8e0d0" stroke="none"/><circle id="ej1" r="11" fill="#e8e0d0" stroke="none"/>
      <path id="hd0" stroke-width="9"/><path id="hd1" stroke-width="9"/>
    </g>
  </g>`;
  big.setAttribute("aria-label","Final boss: a giant skeleton ghost climbing out of the floor");
  const b=st.b;b.m="";b.rm=null;bbars();$("#bmsg").textContent="";
  cancelAnimationFrame(bossRaf);
  const loop=now=>{if(st.view!=="boss"){$("#stage").classList.remove("rumble");return}bossFrame(now);bossRaf=requestAnimationFrame(loop)};
  bossRaf=requestAnimationFrame(loop)}
function bossFrame(now){
  const b=st.b,bb=$("#bb");if(!bb)return;
  const t=Math.max(0,now-b.t0),p=Math.min(1,t/5000);
  const sway=t>5000?Math.sin(t/1100)*80:0,bob=t>5000?Math.sin(t/430)*8:0;
  let off=520*Math.pow(1-p,3);
  if(b.dead){const dp=Math.min(1,(now-b.dt)/2200);off=520*dp*dp}
  if(!b.dead)b.up=t>5600;
  const loose=Math.min(1,Math.max(0,(t-5000)/600)),by=off+(b.dead?0:bob);
  bb.setAttribute("transform",`translate(${sway} ${by})`);
  bb.style.filter=now-(b.flash||0)<140?"brightness(2.4)":"";
  [-1,1].forEach((d,i)=>{
    const sx=500+sway+d*62,sy=240+by,px=500+d*270,py=494,ix=500+sway+d*210,iy=370+Math.sin(t/500+i*2)*22+(b.dead?off:0),
      w=b.dead?0:1-loose,hx=ix+(px-ix)*w,hy=iy+(py-iy)*w,ex=(sx+hx)/2+d*45,ey=Math.min(sy,hy)-40+Math.abs(hy-sy)*.25;
    $("#ar"+i).setAttribute("d",`M${sx} ${sy}L${ex} ${ey}L${hx} ${hy}`);
    $("#ej"+i).setAttribute("cx",ex);$("#ej"+i).setAttribute("cy",ey);
    $("#hd"+i).setAttribute("d",[-2,-1,0,1,2].map(k=>{const a=(-90+k*24)*Math.PI/180;return`M${hx} ${hy}L${hx+Math.cos(a)*38} ${hy+Math.sin(a)*38}`}).join(""))});
  $("#hole").setAttribute("rx",40+130*Math.min(1,p*2.5));
  $("#crack").setAttribute("opacity",t<5400?Math.min(1,t/600):Math.max(0,1-(t-5400)/800));
  const rum=t<5000&&!b.dead;if(rum!==b.rm){b.rm=rum;$("#stage").classList.toggle("rumble",rum)}
  const m=t<5600?"Something is crawling out of the floor...":b.dead?"It crumbles back into the floor.":"Shoot its bones. Hold on to its spirit.";
  if(m!==b.m){b.m=m;$("#bmsg").textContent=m}}
// Every so often, one or two ghosts vanish for 2-3 seconds and reappear somewhere else.
function wander(){setTimeout(()=>{
  if(st.view==="room"&&!document.hidden){const r=rooms[st.sel];
    [...document.querySelectorAll("#big .gw:not(.gone):not(.caught)")].filter(el=>!(hold&&hold.el===el))
      .sort(()=>Math.random()-.5).slice(0,1+(Math.random()<.35?1:0)).forEach(el=>{
        const k=+el.dataset.k;el.classList.add("gone");
        setTimeout(()=>{if(!el.isConnected)return;const p=[130+Math.random()*740,190+Math.random()*250];r.gp[k]=p;
          el.setAttribute("transform",`translate(${p[0]} ${p[1]}) scale(6)`);el.classList.remove("gone")},2000+Math.random()*1000)})}
  wander()},9000+Math.random()*7000)}
wander();walk();setInterval(tick,300);st.en=100;st.up=false;st.broke=false;setInterval(()=>shieldTick(.1),100);st.mode="catch";st.hp=100;st.over=false;hp();tally();
render();
</script>
